<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スコアボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1 id="appTitle" class="app-title">スコアボード</h1>
  <span id="modeBadge" class="mode-badge"></span>
</header>

<main class="container">
  <!-- 読み込み中 -->
  <section id="viewLoading" class="panel center">
    <div class="spinner"></div>
    <p class="muted">読み込み中…</p>
  </section>

  <!-- 接続エラー / 未設定 -->
  <section id="viewError" class="panel narrow center" hidden>
    <h2>接続できません</h2>
    <p id="errorMessage" class="muted"></p>
    <button id="retryBtn" class="btn primary">再読み込み</button>
  </section>

  <!-- 観覧 (参加者・会場向け): 管理者が結果発表を始めると自動で表示 -->
  <section id="viewLive" class="panel narrow center live-wait" hidden>
    <div class="live-icon">🏆</div>
    <h2 id="liveHeading">結果発表をお待ちください</h2>
    <p class="muted">管理者が結果発表を始めると、この画面で自動的に始まります。<br>このページを開いたままお待ちください。</p>
    <p class="live-status"><span id="liveDot" class="live-dot"></span><span id="liveStatus">接続中…</span></p>
    <button id="liveSoundBtn" class="btn primary">🔊 効果音をオンにする</button>
    <p id="liveSoundNote" class="muted small" hidden>効果音: オン</p>
  </section>

  <!-- 審査員ログイン -->
  <section id="viewJudgeLogin" class="panel narrow" hidden>
    <h2>審査員ログイン</h2>
    <form id="judgeLoginForm" class="stack">
      <label class="field">審査員
        <select id="judgeSelect" required></select>
      </label>
      <label class="field">PIN (4 桁)
        <input id="judgePin" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" required>
      </label>
      <button class="btn primary block" type="submit">ログイン</button>
    </form>
    <p class="muted small">PIN は管理者から受け取ってください。</p>
  </section>

  <!-- 審査員: 参加者一覧 -->
  <section id="viewJudgeList" class="stack-lg" hidden>
    <div class="toolbar">
      <div><span class="muted small">審査員</span><br><strong id="judgeName" class="judge-name"></strong></div>
      <div class="toolbar-actions">
        <button id="judgeRefreshBtn" class="btn subtle">↻ 更新</button>
        <button id="judgeLogoutBtn" class="btn subtle">ログアウト</button>
      </div>
    </div>
    <p id="judgeProgress" class="muted"></p>
    <div id="participantGrid" class="card-grid"></div>
  </section>

  <!-- 審査員: 得点入力 -->
  <section id="viewJudgeScore" class="stack-lg" hidden>
    <div class="toolbar">
      <button id="scoreBackBtn" class="btn subtle">← 参加者一覧</button>
    </div>
    <div class="panel">
      <p class="muted small">採点中の参加者</p>
      <h2 id="scoreTarget" class="score-target"></h2>
      <form id="scoreForm" class="stack-lg">
        <div id="scoreFields" class="score-fields"></div>
        <div class="score-total">合計 <strong id="scoreTotal">0</strong> <span class="muted">/ <span id="scoreMax">0</span></span></div>
        <button id="scoreSaveBtn" class="btn primary block big" type="submit">保存する</button>
      </form>
    </div>
  </section>

  <!-- 管理者ログイン -->
  <section id="viewAdminLogin" class="panel narrow" hidden>
    <h2>管理者ログイン</h2>
    <form id="adminLoginForm" class="stack">
      <label class="field">パスワード
        <input id="adminPassword" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary block" type="submit">ログイン</button>
    </form>
  </section>

  <!-- 管理者画面 -->
  <section id="viewAdmin" class="stack-lg" hidden>
    <div class="toolbar sticky">
      <div id="dirtyNote" class="dirty-note" hidden>● 未保存の変更があります</div>
      <div class="toolbar-actions">
        <button id="adminSaveBtn" class="btn primary">保存して全員に反映</button>
        <button id="adminLogoutBtn" class="btn subtle">ログアウト</button>
      </div>
    </div>

    <div class="panel">
      <h2>大会名</h2>
      <input id="adminTitle" class="wide" maxlength="60">
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>審査員</h2>
        <label class="small muted check"><input id="showPins" type="checkbox" autocomplete="off"> PIN を表示</label>
      </div>
      <div id="judgeList" class="item-list"></div>
      <form id="addJudgeForm" class="add-form">
        <input id="newJudgeName" placeholder="審査員名" maxlength="40" required>
        <button class="btn primary" type="submit">追加</button>
      </form>
      <p class="muted small">PIN を空欄で保存すると自動で発行されます。</p>
    </div>

    <div class="panel">
      <h2>参加者</h2>
      <div id="participantList" class="item-list"></div>
      <form id="addParticipantForm" class="add-form">
        <input id="newParticipantName" placeholder="参加者名" maxlength="40" required>
        <button class="btn primary" type="submit">追加</button>
      </form>
    </div>

    <div class="panel">
      <h2>評価項目</h2>
      <div id="criterionList" class="item-list"></div>
      <form id="addCriterionForm" class="add-form">
        <input id="newCriterionName" placeholder="項目名 (例: プレゼン力)" maxlength="40" required>
        <label class="max-label">満点 <input id="newCriterionMax" type="number" min="1" value="10" required></label>
        <button class="btn primary" type="submit">追加</button>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>採点状況</h2>
        <button id="progressRefreshBtn" class="btn subtle small-btn">↻ 更新</button>
      </div>
      <p class="muted small">得点そのものは表示されません。✓ = 全項目入力済み</p>
      <div class="table-wrap"><table id="progressTable" class="progress-table"></table></div>
    </div>

    <div class="announce-wrap">
      <button id="announceBtn" class="btn announce">🏆 結果発表</button>
      <label class="check live-toggle"><input id="liveToggle" type="checkbox" checked autocomplete="off"> 観覧ページ (#live) を開いている人の画面にも同時に表示する</label>
    </div>
  </section>

  <footer class="footer">
    <a href="#live">観覧</a>
    <span class="muted">|</span>
    <a href="#">審査員</a>
    <span class="muted">|</span>
    <a href="#admin">管理者</a>
  </footer>
</main>

<div id="toast" class="toast" hidden></div>

<!-- 結果発表オーバーレイ -->
<div id="overlay" class="overlay" hidden>
  <canvas id="confetti"></canvas>
  <button id="closeOverlay" class="close-btn" aria-label="閉じる">✕</button>
  <div id="liveBadge" class="live-badge" hidden><span class="live-dot on"></span>LIVE</div>
  <div id="stage" class="stage"></div>
  <div class="overlay-footer">
    <button id="nextBtn" class="btn next">次へ ▶</button>
    <label class="sound-toggle"><input id="soundToggle" type="checkbox" checked> 効果音</label>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
